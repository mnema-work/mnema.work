name: Site

# THE SITE IS BUILT FROM THE LATEST RELEASE TAG OF THE PRODUCT, and nothing else. The pages of `docs/`, the README, the
# record and the binary that writes /record/ all come from one checkout of that tag; this repository holds the build and
# the presentation. What the product has on its main branch and has not released is never on the site.
#
# WHEN IT RUNS
#   pull request: builds, and holds the built pages to their sources. Deploys nothing.
#   push to main: builds and deploys (a change to the presentation or to the build).
#   every day, and by hand: asks the product repository for its latest release tag with `git ls-remote` (a public
#     repository: no token) and compares it with the version the LIVE site says it was built from, in the footer of its
#     landing. It builds and deploys only when they differ. By hand, a `tag` builds and deploys that tag again.
#
# THE DEPLOY JOB HOLDS NO SECRET AND NO CODE. It has `pages: write` and `id-token: write` and nothing else, runs no
# checkout and no install, and takes the one artifact the build job uploaded. Everything that runs the product's code or
# the site's dependencies is in the build job, whose token reads the contents and nothing more. Pages is enabled in the
# repository's Settings (source: GitHub Actions), with the custom domain mnema.work.
#
# THE ACTIONS ARE THE ORGANIZATION'S ALLOWLIST: owned by GitHub, or pnpm/action-setup, each at a full commit SHA.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'A release tag of the product to build and publish, for example v0.1.5. Empty: the latest.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: which tag is built, and whether it is published
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      product: ${{ steps.plan.outputs.product }}
      build: ${{ steps.plan.outputs.build }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ask the product for its latest release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          say() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          product="$(node build/the-site.mjs product-url)"
          site="$(node build/the-site.mjs site-url)"
          say product "$product"
          release='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ -n "$ASKED" ]; then
            tag="$ASKED"
            printf '%s' "$tag" | grep -Eq "$release" || { echo "$tag is not a release tag (v<major>.<minor>.<patch>)."; exit 1; }
          else
            tag="$(git ls-remote --tags --refs "$product.git" 'v*' | sed 's#.*refs/tags/##' | grep -E "$release" | sort -V | tail -n 1)"
          fi
          [ -n "$tag" ] || { echo "The product has no release tag."; exit 1; }
          say tag "$tag"
          say build true
          case "$EVENT" in
            pull_request) say deploy false ;;
            schedule)
              # What the live site says it was built from: the version in the footer of its landing page. A site that
              # is not there yet, or that says nothing, differs from every tag.
              live="$(curl -fsS --max-time 30 "$site/" | grep -Eo 'data-version>[0-9.]+<' | head -n 1 | sed -E 's/data-version>(.*)</\1/' || true)"
              if [ "$live" = "${tag#v}" ]; then
                echo "The live site is built from $tag: nothing to publish."
                say build false
                say deploy false
              else
                echo "The live site says '${live:-nothing}' and the latest release is $tag: the site is built and published."
                say deploy true
              fi
              ;;
            *) say deploy true ;;
          esac

  build:
    name: the site builds and says what it was made from
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PRODUCT: ${{ needs.plan.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag's own files, from a public repository: no token, and no history.
      - name: Take the product at its release tag
        run: git clone --quiet --depth 1 --branch "$TAG" "$PRODUCT.git" product

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: product/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The binary of that very tag writes /record/, and the favicon, the card and the colours are drawn from its files.
      - name: Build the product
        working-directory: product
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The site's own dependencies, from its own lockfile, with no install script.
      - name: Install the site's dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Astro sends anonymous usage data unless told not to; a build of this site sends none.
      - name: Build the site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: node build/build.mjs --from product

      - name: Type-check the tests
        run: npm run typecheck

      # The built pages against their sources, and the pages' links against each other. A missing build is a failure here.
      - name: Hold the built site to its sources
        env:
          PRODUCT_DIR: product
          THE_SITE_MUST_BE_BUILT: '1'
        run: npx vitest run

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: needs.plan.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    name: publish the site
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Nothing else: no contents, no secret, no checkout.
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
